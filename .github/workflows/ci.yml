name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm run test

      - name: Build packages
        run: npm run build

  verification:
    name: Offline Production Verification & Smokes (Node 22.x)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Validate Skill OS
        run: npm run skills:check

      - name: Smoke - Media Toolchain
        run: npm run smoke:media

      - name: Smoke - Master Golden Video
        run: npm run smoke:golden

      - name: Smoke - Google Flow Bridge
        run: npm run smoke:flow

      - name: Smoke - Google Flow Real Media Acceptance
        run: npm run smoke:flow-media

      - name: Smoke - Visual Semantic QA Reality
        run: npm run smoke:visual-qa

      - name: Smoke - Phase 18 Offline Production Rehearsal
        run: npm run smoke:production

